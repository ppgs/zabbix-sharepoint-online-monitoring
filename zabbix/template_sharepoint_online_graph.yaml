    tags:
    - tag: class
      value: software
    - tag: target
      value: microsoft365
    - tag: target
      value: sharepoint
    macros:
    - macro: '{$SPO.BIGFILES.INTERVAL}'
      value: 6h
      description: Intervalo da pesquisa dos maiores arquivos (inclui a leitura das versões).
    - macro: '{$SPO.BIGFILES.MAX}'
      value: '50'
      description: Quantos dos maiores arquivos viram itens no Zabbix. Máximo 500.
    - macro: '{$SPO.BIGFILES.MIN_MB}'
      value: '200'
      description: Tamanho mínimo (MB) para o arquivo entrar na pesquisa.
    - macro: '{$SPO.BIGFILES.ONEDRIVE}'
      value: '0'
      description: 1 = inclui arquivos dos OneDrives pessoais; 0 = só SharePoint (é o que conta na cota do tenant).
    - macro: '{$SPO.BIGFILES.TIMEOUT}'
      value: 300s
      description: Timeout do item Script dos maiores arquivos e versões (máximo 600s).
    - macro: '{$SPO.CLIENT.ID}'
      value: ''
      description: ID do aplicativo (cliente) do App Registration com Reports.Read.All (aplicativo). Defina no host.
    - macro: '{$SPO.CLIENT.SECRET}'
      value: ''
      description: Segredo do cliente do App Registration. Defina no host. Anote a data de expiração.
      type: SECRET_TEXT
    - macro: '{$SPO.FOLDERS.INTERVAL}'
      value: 3h
      description: Intervalo da coleta de bibliotecas e pastas.
    - macro: '{$SPO.FOLDERS.MAX}'
      value: '200'
      description: Quantidade máxima de pastas de 1º nível (as maiores) que viram itens no Zabbix.
    - macro: '{$SPO.FOLDERS.SITES}'
      value: ''
      description: 'URLs dos sites para detalhar por biblioteca/pasta, separadas por vírgula. Ex.: https://contoso.sharepoint.com/. Vazio = não coleta.'
    - macro: '{$SPO.FOLDERS.TIMEOUT}'
      value: 300s
      description: Timeout do item Script de bibliotecas e pastas (máximo 600s).
    - macro: '{$SPO.GET_INTERVAL}'
      value: 6h
      description: Intervalo da coleta. Os relatórios do Graph mudam uma vez por dia.
    - macro: '{$SPO.LIBRARIES.ALL}'
      value: '1'
      description: 1 = coleta o tamanho das bibliotecas de todos os sites; 0 = só dos sites em {$SPO.FOLDERS.SITES}.
    - macro: '{$SPO.LIBRARIES.MIN_MB}'
      value: '100'
      description: Bibliotecas menores que este tamanho (MB) não viram itens, para não poluir o Zabbix.
    - macro: '{$SPO.LLD.URL.MATCHES}'
      value: .*
      description: 'Filtro: descobre apenas sites cuja URL casa com esta regex.'
    - macro: '{$SPO.LLD.URL.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: 'Filtro: ignora sites cuja URL casa com esta regex.'
    - macro: '{$SPO.NODATA.TIMEOUT}'
      value: 13h
      description: Tempo sem dados de armazenamento para alertar (pelo menos 2x o intervalo da coleta).
    - macro: '{$SPO.PROXY}'
      value: ''
      description: 'Proxy HTTP opcional para a saída do Zabbix, ex.: http://proxy.exemplo.local:3128. Vazio = sem proxy.'
    - macro: '{$SPO.RB.CERT.THUMBPRINT}'
      value: ''
      description: Impressão digital (SHA-1, hexadecimal) do certificado carregado no app. Aparece em Certificados e segredos.
    - macro: '{$SPO.RB.CLIENT.ID}'
      value: ''
      description: ID do app com a permissão SharePoint Sites.FullControl.All (aplicativo) e o certificado. Vazio = usa o mesmo app ({$SPO.CLIENT.ID}).
    - macro: '{$SPO.RB.ENABLED}'
      value: '0'
      description: 'Leitura das lixeiras (1º e 2º estágio): 1 = ativa, 0 = desativada. Exige certificado no app e a permissão SharePoint Sites.FullControl.All (aplicativo). Veja a documentação.'
    - macro: '{$SPO.RB.INTERVAL}'
      value: 6h
      description: Intervalo da leitura das lixeiras.
    - macro: '{$SPO.RB.NODATA}'
      value: 13h
      description: Alerta se a leitura das lixeiras ficar sem dados nesse período.
    - macro: '{$SPO.RB.PRIVATE.KEY}'
      value: ''
      description: Chave privada do certificado em PEM (RSA 2048, PKCS#8 ou PKCS#1), pode ser colada em uma linha só. Máximo 2048 caracteres.
      type: SECRET_TEXT
    - macro: '{$SPO.RB.SITE.MIN_MB}'
      value: '100'
      description: Só viram itens por site as lixeiras (1º + 2º estágio) acima deste tamanho em MB. Os totais incluem todos os sites.
    - macro: '{$SPO.RB.TIMEOUT}'
      value: 600s
      description: Timeout do item de leitura das lixeiras (máximo 600s).
    - macro: '{$SPO.REPORT.MAXAGE}'
      value: '259200'
      description: Idade máxima do relatório do Graph, em segundos (259200 = 3 dias).
    - macro: '{$SPO.SCRIPT.TIMEOUT}'
      value: 60s
      description: Timeout do item Script (token + 2 relatórios).
    - macro: '{$SPO.SEARCH.REGION}'
      value: ''
      description: 'Região da Pesquisa do Microsoft 365 (ex.: BRA). Vazio = detecta automaticamente.'
    - macro: '{$SPO.SITE.PUSED.HIGH}'
      value: '95'
      description: Percentual da cota do site para alerta High.
    - macro: '{$SPO.SITE.PUSED.WARN}'
      value: '85'
      description: Percentual da cota do site para alerta Warning.
    - macro: '{$SPO.TENANT.ID}'
      value: ''
      description: ID do diretório (locatário) do Entra ID. Defina no host.
    - macro: '{$SPO.TENANT.PUSED.CRIT}'
      value: '100'
      description: Percentual da cota do tenant para alerta High (acima de 100% o SharePoint fica somente leitura).
    - macro: '{$SPO.TENANT.PUSED.WARN}'
      value: '90'
      description: Percentual da cota do tenant para alerta Warning.
    - macro: '{$SPO.TENANT.QUOTA.GB}'
      value: '0'
      description: 'Cota total do tenant em GB: (Get-SPOTenant).StorageQuota / 1024. Defina no host.'
    - macro: '{$SPO.VERSIONS.MIN_MB}'
      value: '50'
      description: Tamanho mínimo (MB) do arquivo para entrar na análise de versões.
    - macro: '{$SPO.VERSIONS.SCAN}'
      value: '500'
      description: Quantos dos maiores arquivos têm as versões medidas para achar os maiores históricos de versões (máximo 2000; cada 20 arquivos = 1 chamada $batch ao Graph).
