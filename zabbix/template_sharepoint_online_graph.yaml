        tags:
        - tag: component
          value: storage
        - tag: site
          value: '{#SITE.URL}'
        trigger_prototypes:
        - uuid: 099609f9ae634645ad6627f07434e165
          expression: last(/SharePoint Online by Microsoft Graph/spo.site.pused[{#SITE.ID}])>={$SPO.SITE.PUSED.HIGH}
          name: 'SPO: {#SITE.URL} acima de {$SPO.SITE.PUSED.HIGH}% da cota do site'
          opdata: 'Uso: {ITEM.LASTVALUE1}'
          priority: HIGH
          description: Só faz sentido em sites com cota manual. Com gerenciamento automático de armazenamento, a cota do site é o limite automático do tenant.
          tags:
          - tag: scope
            value: capacity
        - uuid: bf276827d5584b5fbf0202fb8f13c3c7
          expression: last(/SharePoint Online by Microsoft Graph/spo.site.pused[{#SITE.ID}])>={$SPO.SITE.PUSED.WARN}
          name: 'SPO: {#SITE.URL} acima de {$SPO.SITE.PUSED.WARN}% da cota do site'
          opdata: 'Uso: {ITEM.LASTVALUE1}'
          priority: WARNING
          dependencies:
