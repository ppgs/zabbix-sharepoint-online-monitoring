          error_handler: DISCARD_VALUE
        master_item:
          key: spo.reports.get
        tags:
        - tag: component
          value: storage
        - tag: site
          value: '{#SITE.URL}'
      - uuid: af4928fc940a47768bd44421e6ea0a36
