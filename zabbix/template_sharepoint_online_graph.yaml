        master_item:
          key: spo.reports.get
        tags:
        - tag: component
          value: storage
        - tag: site
          value: '{#SITE.URL}'
      - uuid: 9d54641a113a45118e78702403948978
        name: 'Site {#SITE.URL}: % da cota usada'
        type: DEPENDENT
        key: spo.site.pused[{#SITE.ID}]
        history: 90d
        value_type: FLOAT
        trends: 365d
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.sites[?(@.id=='{#SITE.ID}')].pused.first()
