    - uuid: ea01cb620fe34caa9db3f6a86af69f9d
      name: 'SPO: Descoberta de sites'
      type: DEPENDENT
      key: spo.sites.discovery
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SITE.URL}'
          value: '{$SPO.LLD.URL.MATCHES}'
