          value: '{$SPO.LLD.URL.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
      lifetime: 7d
      description: Descobre os sites ativos do relatório getSharePointSiteUsageDetail. Sites excluídos ficam fora e entram no total de "Sites excluídos".
